name: Profil kartini guncelle

on:
  schedule:
    - cron: "47 15 * * *"     # her gun 15:47 UTC (18:47 TR)
  workflow_dispatch:           # elle de calistirilabilir
  push:                        # repoya her push'ta da guncelle (or. Meowly karti)
    branches: [main]
    paths-ignore: ["profile-card.svg", "stats_cache.json"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Karti olustur
        env:
          # Ozel repolarini de saymak istersen: Settings > Secrets'a GH_PAT ekle
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python build_card.py
      - name: Degisiklik varsa kaydet
        run: |
          git config user.name "Mert Pural"
          git config user.email "250704201+mertpural@users.noreply.github.com"
          git add profile-card.svg stats_cache.json
          git diff --cached --quiet || git commit -m "profil karti guncellendi"
          git pull --rebase
          git push
